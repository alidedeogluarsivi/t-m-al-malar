<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alidedeoğlu Arşivi Haritası</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0}body{font-family:Arial,Helvetica,sans-serif;background:#f3efe6;color:#172b3d}#map{background:#f3efe6}
.nav{position:absolute;z-index:1000;top:12px;left:12px;width:min(400px,calc(100% - 24px));background:rgba(255,255,255,.97);border:1px solid #c9bda7;border-radius:15px;padding:13px 15px;box-shadow:0 8px 28px rgba(0,0,0,.14)}
.nav .tag{font-size:10px;font-weight:800;letter-spacing:.13em;color:#9a6725}.nav h1{margin:3px 0 5px;font:700 20px Georgia,serif;color:#142d45}.nav p{margin:0;color:#66727b;font-size:11px}.crumb{margin-top:9px;font-weight:800;color:#16384f;font-size:13px}.status{margin-top:5px;color:#8b5b1d;font-size:12px}.controls{display:flex;gap:7px;margin-top:9px}.btn{border:0;border-radius:8px;padding:7px 10px;background:#16384f;color:#fff;font-weight:700;font-size:11px;cursor:pointer}.btn.light{background:#e9e1d3;color:#17364e}.hidden{display:none!important}
.drawer{position:absolute;z-index:1100;top:10px;right:10px;bottom:10px;width:min(470px,calc(100% - 20px));background:#fff;border:1px solid #cbbda5;border-radius:18px;box-shadow:0 18px 45px rgba(24,38,50,.22);overflow:hidden;display:none;flex-direction:column}.drawer.open{display:flex}.dhead{padding:17px 18px 14px;background:linear-gradient(135deg,#132f46,#1f516b);color:#fff}.dhead .small{font-size:10px;letter-spacing:.12em;color:#d9c189;font-weight:800}.dhead h2{font:600 29px Georgia,serif;margin:4px 0}.dhead p{margin:0;color:#d9e5ec;font-size:12px}.close{position:absolute;right:13px;top:13px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;width:31px;height:31px;border-radius:50%;font-size:18px;cursor:pointer}.dbody{padding:15px 17px 25px;overflow:auto;background:#fbfaf6}.badgeRow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.badge{font-size:10px;font-weight:800;border-radius:999px;padding:5px 8px;background:#eee6d8;color:#664b24;border:1px solid #d7c6a8}.badge.good{background:#e5f1e9;color:#285d3e;border-color:#bad4c3}.section{border-top:1px solid #e1d8c8;padding-top:13px;margin-top:13px}.section h3{font:700 16px Georgia,serif;margin:0 0 9px;color:#183950}.record{background:#fff;border:1px solid #e1d7c7;border-radius:10px;padding:10px 11px;margin:7px 0;line-height:1.45;font-size:12px}.record b{color:#17384e}.family{display:inline-block;padding:4px 7px;margin:3px 4px 3px 0;border-radius:7px;background:#f0ece4;border:1px solid #ded4c5;font-size:11px}.empty{padding:13px;border:1px dashed #c9bda7;border-radius:10px;color:#76818a;font-size:12px}.scan{font-size:11px;padding:7px 0;border-bottom:1px dotted #ddd0be}.legend{position:absolute;z-index:900;right:12px;bottom:18px;background:rgba(255,255,255,.94);border:1px solid #d8cdbb;border-radius:10px;padding:9px 11px;font-size:11px;line-height:1.7}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.read{background:#2d7650}.none{background:#d6cbb8}.leaflet-tooltip{font-weight:700}
@media(max-width:760px){.nav{top:7px;left:7px;width:calc(100% - 14px)}.drawer{top:5px;right:5px;bottom:5px;width:calc(100% - 10px)}.legend{display:none}.dhead h2{font-size:25px}}
</style></head><body>
<div id="map"></div>
<div class="nav"><div class="tag">ALİDEDEOĞLU ARŞİVİ</div><h1>İl → İlçe → Köy</h1><p>Köye tıklayınca arşiv dosyası açılır.</p><div id="crumb" class="crumb">TÜRKİYE</div><div id="status" class="status">Arşiv ve sınır verileri yükleniyor…</div><div class="controls"><button id="back" class="btn hidden">← GERİ</button><button id="home" class="btn light">TÜRKİYE</button></div></div>
<div class="drawer" id="drawer"><button id="close" class="close">×</button><div class="dhead"><div class="small">KÖY ARŞİV DOSYASI</div><h2 id="vtitle">KÖY</h2><p id="vloc"></p></div><div class="dbody" id="vbody"></div></div>
<div class="legend"><div><span class="dot read"></span>ARŞİV KAYDI VAR</div><div><span class="dot none"></span>HENÜZ EŞLEŞEN KAYIT YOK</div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map',{zoomControl:true,minZoom:5,maxZoom:16}).setView([39,35.2],6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const PROV='https://raw.githubusercontent.com/ttezer/turkiye-harita-verisi/master/dist/geojson/provinces.geojson';
const DIST='https://raw.githubusercontent.com/ttezer/turkiye-harita-verisi/master/dist/geojson/districts.geojson';
const MAH='https://raw.githubusercontent.com/ttezer/turkiye-harita-verisi/master/dist/geojson/mahalle-geometrileri-by-district-v2/';
const ARCH=['archive_1.ndjson','archive_2.ndjson','archive_3.ndjson','archive_4.ndjson'];
const $=id=>document.getElementById(id), statusEl=$('status'), crumb=$('crumb'), back=$('back'), drawer=$('drawer');
let provincesData,districtsData,provinceLayer,districtLayer,villageLayer,districtOutline,selectedProvince,selectedDistrict;
let archive=[], index=new Map(), summary={};
function norm(s){return (s||'').toLocaleLowerCase('tr-TR').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[ıİ]/g,'i').replace(/[şŞ]/g,'s').replace(/[ğĞ]/g,'g').replace(/[üÜ]/g,'u').replace(/[öÖ]/g,'o').replace(/[çÇ]/g,'c').replace(/[^a-z0-9]+/g,'');}
function key(il,ilce,koy){return norm(il)+'|'+norm(ilce)+'|'+norm(koy)}
async function json(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status+' '+u);return r.json()}
async function text(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status+' '+u);return r.text()}
async function loadArchive(){for(const f of ARCH){const t=await text(f);for(const line of t.split(/?
/)){if(!line.trim())continue;const x=JSON.parse(line);if(x._summary){summary=x._summary;continue}archive.push(x)}}for(const r of archive){if(r.il&&r.ilce&&r.koy)index.set(key(r.il,r.ilce,r.koy),r)}}
function recFor(v){let r=index.get(key(selectedProvince?.name,selectedDistrict?.name,v));if(r)return r;const cand=archive.filter(x=>x.koy&&norm(x.koy)===norm(v)&&x.ilce&&norm(x.ilce)===norm(selectedDistrict?.name));return cand.length===1?cand[0]:null}
function setBack(){back.classList.toggle('hidden',!selectedProvince)}
function clearVillage(){if(villageLayer){map.removeLayer(villageLayer);villageLayer=null}if(districtOutline){map.removeLayer(districtOutline);districtOutline=null}}
function drawProvinces(){if(districtLayer){map.removeLayer(districtLayer);districtLayer=null}clearVillage();selectedProvince=null;selectedDistrict=null;drawer.classList.remove('open');crumb.textContent='TÜRKİYE';statusEl.textContent='Bir ile tıklayın.';if(provinceLayer)map.removeLayer(provinceLayer);provinceLayer=L.geoJSON(provincesData,{style:{color:'#7d2c2c',weight:1.65,fillColor:'#faf3e4',fillOpacity:.22},onEachFeature:(f,l)=>{const n=f.properties.name;l.bindTooltip(n,{sticky:true});l.on('click',()=>openProvince(f,l))}}).addTo(map);map.setView([39,35.2],6);setBack()}
function openProvince(f,l){selectedProvince={id:f.properties.id,name:f.properties.name};selectedDistrict=null;drawer.classList.remove('open');if(provinceLayer){map.removeLayer(provinceLayer);provinceLayer=null}clearVillage();const feats=districtsData.features.filter(x=>x.properties.parent_id===selectedProvince.id);districtLayer=L.geoJSON({type:'FeatureCollection',features:feats},{style:{color:'#9a6b24',weight:1.35,fillColor:'#e8d4a9',fillOpacity:.22},onEachFeature:(df,dl)=>{const n=df.properties.name;dl.bindTooltip(n,{sticky:true});dl.on('click',()=>openDistrict(df,dl))}}).addTo(map);crumb.textContent=selectedProvince.name.toLocaleUpperCase('tr-TR');statusEl.textContent=feats.length+' ilçe gösteriliyor. İlçeye tıklayın.';map.fitBounds(l.getBounds(),{padding:[18,18]});setBack()}
async function openDistrict(f,l){selectedDistrict={id:f.properties.id,name:f.properties.name};drawer.classList.remove('open');if(districtLayer){map.removeLayer(districtLayer);districtLayer=null}clearVillage();districtOutline=L.geoJSON(f,{style:{color:'#9a6b24',weight:2.1,fillOpacity:.02}}).addTo(map);crumb.textContent=selectedProvince.name.toLocaleUpperCase('tr-TR')+' → '+selectedDistrict.name.toLocaleUpperCase('tr-TR');statusEl.textContent='Köy / mahalle sınırları yükleniyor…';map.fitBounds(l.getBounds(),{padding:[18,18]});try{const gj=await json(MAH+selectedDistrict.id+'.geojson');villageLayer=L.geoJSON(gj,{style:vf=>{const vn=vf.properties.name||vf.properties.source_raw_name||'';const has=!!recFor(vn);return {color:has?'#2d7650':'#9d9484',weight:has?1.7:.75,fillColor:has?'#80b596':'#d8d0c2',fillOpacity:has?.33:.08}},onEachFeature:(vf,vl)=>{const vn=vf.properties.name||vf.properties.source_raw_name||'KÖY / MAHALLE';const r=recFor(vn);vl.bindTooltip((r?'● ':'')+vn,{sticky:true});vl.on('click',()=>showVillage(vn,r))}}).addTo(map);const matched=gj.features.filter(x=>recFor(x.properties.name||x.properties.source_raw_name||'')).length;statusEl.textContent=gj.features.length+' köy/mahalle · '+matched+' arşiv eşleşmesi.'}catch(e){statusEl.textContent='Bu ilçe için açık köy/mahalle poligonu bulunamadı.'}setBack()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showVillage(vn,r){$('vtitle').textContent=vn;$('vloc').textContent=selectedDistrict.name+' / '+selectedProvince.name;let h='';if(!r){h='<div class="empty"><b>HENÜZ EŞLEŞEN ARŞİV KAYDI YOK.</b><br>Bu köy için doğrulanmış veri bulunduğunda karta eklenecektir.</div>';$('vbody').innerHTML=h;drawer.classList.add('open');return}
const defs=r.defterler||[],fam=r.sulaleler||[],scans=r.taramalar||[],gos=r.gorevli_notlari||[];h+='<div class="badgeRow">';if(defs.length)h+='<span class="badge good">'+defs.length+' BELGE/KAYIT</span>';if(fam.length)h+='<span class="badge good">'+fam.length+' SÜLALE</span>';if(scans.length)h+='<span class="badge">'+scans.length+' ARŞİV TARAMASI</span>';h+='</div>';
h+='<div class="section"><h3>DEFTER VE NÜFUS BİLGİLERİ</h3>';if(!defs.length)h+='<div class="empty">Defter bilgisi henüz bağlanmadı.</div>';for(const d of defs.slice(0,80)){h+='<div class="record">';if(d.tur)h+='<b>'+esc(d.tur)+'</b><br>';if(d.defter)h+='Defter: <b>'+esc(d.defter)+'</b> ';if(d.yil)h+='· Yıl: '+esc(d.yil);if(d.varak)h+='<br>Varak: <b>'+esc(d.varak)+'</b>';if(d.sayfa)h+=' · Sayfa: '+esc(d.sayfa);if(d.hane)h+='<br>Hane: <b>'+esc(d.hane)+'</b>';if(d.erkek)h+=' · Erkek: <b>'+esc(d.erkek)+'</b>';if(d.sulale)h+='<br>Sülale: '+esc(d.sulale);if(d.tarihi_kaza)h+='<br>Tarihî kaza: '+esc(d.tarihi_kaza);if(d.dogrulama)h+='<br><small>'+esc(d.dogrulama)+'</small>';h+='</div>'}h+='</div>';
h+='<div class="section"><h3>İMAM / MUHTAR / GÖREVLİ</h3>';if(!gos.length)h+='<div class="empty">Görevli bilgisi henüz tespit edilmedi.</div>';for(const g of gos)h+='<div class="record">'+esc(g)+'</div>';h+='</div>';
h+='<div class="section"><h3>SÜLALE ADLARI</h3>';if(!fam.length)h+='<div class="empty">Sülale bilgisi henüz bağlanmadı.</div>';else for(const f of fam)h+='<span class="family">'+esc(f)+'</span>';h+='</div>';
h+='<div class="section"><h3>ARŞİV TARAMASI / ÇALIŞMA DOSYALARI</h3>';if(!scans.length)h+='<div class="empty">Ayrı tarama kaydı bulunmuyor.</div>';for(const s of scans.slice(0,100))h+='<div class="scan"><b>'+esc(s.ad||'ARŞİV KAYDI')+'</b>'+(s.yil?' · '+esc(s.yil):'')+(s.tur?' · '+esc(s.tur):'')+'</div>';h+='</div>';
$('vbody').innerHTML=h;drawer.classList.add('open')}
$('close').onclick=()=>drawer.classList.remove('open');$('home').onclick=drawProvinces;back.onclick=()=>{if(selectedDistrict){const pf=provincesData.features.find(x=>x.properties.id===selectedProvince.id);openProvince(pf,L.geoJSON(pf))}else drawProvinces()};
(async()=>{try{statusEl.textContent='Arşiv verileri yükleniyor…';await loadArchive();[provincesData,districtsData]=await Promise.all([json(PROV),json(DIST)]);drawProvinces();statusEl.textContent='Bir ile tıklayın. '+summary.yerlesim_karti+' yerleşim kartı hazır.'}catch(e){console.error(e);statusEl.textContent='Harita veya arşiv verisi yüklenemedi.'}})();
</script></body></html>
