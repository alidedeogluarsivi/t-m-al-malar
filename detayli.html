<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Okunmuş Yerler Haritası</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f7f4ee}
#map{background:#f7f4ee}
.panel{position:absolute;z-index:1000;top:12px;left:12px;width:min(400px,calc(100% - 24px));background:rgba(255,255,255,.97);border:1px solid #cfc6b6;border-radius:14px;padding:14px 16px;box-shadow:0 8px 28px rgba(0,0,0,.14)}
.panel h1{margin:0 0 4px;font:700 20px Georgia,serif;color:#142d45}
.panel p{margin:3px 0;color:#55616d;font-size:12px;line-height:1.4}
#crumb{margin-top:9px;font-weight:700;color:#142d45}
#status{margin-top:6px;color:#8b5b1d}
#back{margin-top:9px;border:0;border-radius:8px;padding:7px 10px;background:#142d45;color:#fff;font-weight:700;cursor:pointer;display:none}
.legend{position:absolute;z-index:1000;right:12px;bottom:20px;background:rgba(255,255,255,.95);border:1px solid #d8d0c2;border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.7;box-shadow:0 6px 20px rgba(0,0,0,.1)}
.sw{display:inline-block;width:22px;height:3px;margin-right:7px;vertical-align:middle}
.prov{background:#8f2d2d}.dist{background:#b9852d}.vill{background:#316e51}.read{background:#111;height:8px;width:8px;border-radius:50%}
@media(max-width:640px){.panel{top:8px;left:8px;width:calc(100% - 16px);padding:10px 12px}.panel h1{font-size:17px}.legend{right:8px;bottom:14px}}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>OKUNMUŞ YERLER HARİTASI</h1>
  <p>TÜRKİYE → İL → İLÇE → KÖY / MAHALLE</p>
  <div id="crumb">TÜRKİYE</div>
  <div id="status">İller yükleniyor…</div>
  <button id="back">← GERİ</button>
</div>
<div class="legend">
 <div><span class="sw prov"></span>İL SINIRI</div>
 <div><span class="sw dist"></span>İLÇE SINIRI</div>
 <div><span class="sw vill"></span>KÖY / MAHALLE SINIRI</div>
 <div><span class="sw read"></span>OKUNMUŞ YER</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{zoomControl:true,minZoom:5,maxZoom:16}).setView([39,35.2],6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);

const PROV='https://raw.githubusercontent.com/ttezer/turkiye-harita-verisi/master/dist/geojson/provinces.geojson';
const DIST='https://raw.githubusercontent.com/ttezer/turkiye-harita-verisi/master/dist/geojson/districts.geojson';
const MAH='https://raw.githubusercontent.com/ttezer/turkiye-harita-verisi/master/dist/geojson/mahalle-geometrileri-by-district-v2/';
const READ='./okunanlar.json';

const statusEl=document.getElementById('status');
const crumb=document.getElementById('crumb');
const backBtn=document.getElementById('back');

let provincesData=null, districtsData=null;
let provinceLayer=null, districtLayer=null, villageLayer=null, selectedDistrictOutline=null, readLayer=null;
let selectedProvince=null, selectedDistrict=null;

async function getJSON(url){const r=await fetch(url);if(!r.ok)throw new Error(r.status+' '+url);return r.json();}
function clear(layerName){
 const layer=window[layerName];
 if(layer){map.removeLayer(layer);window[layerName]=null;}
}
function showBack(){backBtn.style.display=(selectedProvince||selectedDistrict)?'inline-block':'none';}

function drawProvinces(){
 if(districtLayer){map.removeLayer(districtLayer);districtLayer=null;}
 if(villageLayer){map.removeLayer(villageLayer);villageLayer=null;}
 if(selectedDistrictOutline){map.removeLayer(selectedDistrictOutline);selectedDistrictOutline=null;}
 selectedProvince=null;selectedDistrict=null;
 crumb.textContent='TÜRKİYE';
 statusEl.textContent='Bir ile tıklayın.';
 if(provinceLayer) map.removeLayer(provinceLayer);
 provinceLayer=L.geoJSON(provincesData,{
   style:{color:'#8f2d2d',weight:1.7,fillColor:'#fff7e8',fillOpacity:.10},
   onEachFeature:(f,l)=>{
     const n=f.properties.name||'İL';
     l.bindTooltip(n,{sticky:true});
     l.on('click',()=>openProvince(f,l));
   }
 }).addTo(map);
 map.setView([39,35.2],6);
 showBack();
}

function openProvince(f,l){
 selectedProvince={id:f.properties.id,name:f.properties.name};
 selectedDistrict=null;
 if(provinceLayer){map.removeLayer(provinceLayer);provinceLayer=null;}
 if(villageLayer){map.removeLayer(villageLayer);villageLayer=null;}
 if(selectedDistrictOutline){map.removeLayer(selectedDistrictOutline);selectedDistrictOutline=null;}

 const feats=districtsData.features.filter(x=>x.properties.parent_id===selectedProvince.id);
 districtLayer=L.geoJSON({type:'FeatureCollection',features:feats},{
   style:{color:'#b9852d',weight:1.4,fillColor:'#f5dfb8',fillOpacity:.13},
   onEachFeature:(df,dl)=>{
      const dn=df.properties.name||'İLÇE';
      dl.bindTooltip(dn,{sticky:true});
      dl.on('click',()=>openDistrict(df,dl));
   }
 }).addTo(map);

 crumb.textContent=selectedProvince.name.toLocaleUpperCase('tr-TR');
 statusEl.textContent=feats.length+' ilçe gösteriliyor. Bir ilçeye tıklayın.';
 map.fitBounds(l.getBounds(),{padding:[18,18]});
 showBack();
}

async function openDistrict(f,l){
 selectedDistrict={id:f.properties.id,name:f.properties.name};
 if(districtLayer){map.removeLayer(districtLayer);districtLayer=null;}
 if(villageLayer){map.removeLayer(villageLayer);villageLayer=null;}
 if(selectedDistrictOutline){map.removeLayer(selectedDistrictOutline);selectedDistrictOutline=null;}

 selectedDistrictOutline=L.geoJSON(f,{style:{color:'#b9852d',weight:2.2,fillColor:'#f5dfb8',fillOpacity:.04}}).addTo(map);
 crumb.textContent=selectedProvince.name.toLocaleUpperCase('tr-TR')+' → '+selectedDistrict.name.toLocaleUpperCase('tr-TR');
 statusEl.textContent='Köy / mahalle sınırları yükleniyor…';
 map.fitBounds(l.getBounds(),{padding:[20,20]});
 showBack();

 try{
   const gj=await getJSON(MAH+selectedDistrict.id+'.geojson');
   villageLayer=L.geoJSON(gj,{
     style:{color:'#316e51',weight:.9,fillColor:'#8fc5a9',fillOpacity:.12},
     onEachFeature:(vf,vl)=>{
       const vn=vf.properties.name||vf.properties.source_raw_name||'KÖY / MAHALLE';
       vl.bindTooltip(vn,{sticky:true});
       vl.bindPopup('<b>'+vn+'</b><br>'+selectedDistrict.name+' / '+selectedProvince.name);
     }
   }).addTo(map);
   statusEl.textContent=gj.features.length+' köy/mahalle gösteriliyor. Bir köye tıklayın.';
 }catch(e){
   statusEl.textContent='Bu ilçe için açık köy/mahalle sınırı bulunamadı.';
 }
}

backBtn.addEventListener('click',()=>{
 if(selectedDistrict){
   selectedDistrict=null;
   if(villageLayer){map.removeLayer(villageLayer);villageLayer=null;}
   if(selectedDistrictOutline){map.removeLayer(selectedDistrictOutline);selectedDistrictOutline=null;}
   const pf=provincesData.features.find(x=>x.properties.id===selectedProvince.id);
   const bounds=L.geoJSON(pf).getBounds();
   const feats=districtsData.features.filter(x=>x.properties.parent_id===selectedProvince.id);
   districtLayer=L.geoJSON({type:'FeatureCollection',features:feats},{
     style:{color:'#b9852d',weight:1.4,fillColor:'#f5dfb8',fillOpacity:.13},
     onEachFeature:(df,dl)=>{const dn=df.properties.name||'İLÇE';dl.bindTooltip(dn,{sticky:true});dl.on('click',()=>openDistrict(df,dl));}
   }).addTo(map);
   crumb.textContent=selectedProvince.name.toLocaleUpperCase('tr-TR');
   statusEl.textContent=feats.length+' ilçe gösteriliyor. Bir ilçeye tıklayın.';
   map.fitBounds(bounds,{padding:[18,18]});
 }else if(selectedProvince){
   drawProvinces();
 }
 showBack();
});

async function loadRead(){
 try{
   const a=await getJSON(READ);
   readLayer=L.layerGroup().addTo(map);
   a.forEach(x=>{
     if(!Number.isFinite(x.lat)||!Number.isFinite(x.lon))return;
     const m=L.circleMarker([x.lat,x.lon],{radius:5,color:'#111',weight:2,fillColor:'#fff',fillOpacity:1});
     let h='<b>'+x.koy+'</b><br>'+[x.ilce,x.il].filter(Boolean).join(' / ');
     if(x.nfs)h+='<br><b>NFS:</b> '+x.nfs;
     if(x.tmt)h+='<br><b>TMT:</b> '+x.tmt;
     if(x.varak)h+='<br><b>Varak:</b> '+x.varak;
     if(x.hane)h+='<br><b>Hane:</b> '+x.hane;
     if(x.erkek)h+='<br><b>Erkek:</b> '+x.erkek;
     m.bindPopup(h);m.bindTooltip(x.koy,{direction:'top'});m.addTo(readLayer);
   });
 }catch(e){console.warn('okunanlar.json henüz yok',e);}
}

(async()=>{
 try{
   [provincesData,districtsData]=await Promise.all([getJSON(PROV),getJSON(DIST)]);
   drawProvinces();
   loadRead();
 }catch(e){
   console.error(e);
   statusEl.textContent='Harita sınır verisi yüklenemedi.';
 }
})();
</script>
</body>
</html>
