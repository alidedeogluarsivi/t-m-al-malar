<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yeradları Haritası | Alidedeoğlu Arşivi</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--ink:#1c2b27;--mut:#687871;--line:#e1e7df;--green:#174e3f;--red:#cf2028}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:#f7f8f4}
button,select,input{font:inherit}button{cursor:pointer}header{height:54px;display:flex;align-items:center;gap:16px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:1001}
header a{font-size:13px;color:var(--green);text-decoration:none;font-weight:700}header strong{font-size:16px;letter-spacing:.015em}
header span{font-size:12px;color:var(--mut);margin-left:auto}
main{height:calc(100vh - 54px);display:grid;grid-template-columns:310px minmax(0,1fr)}
aside{display:flex;flex-direction:column;min-height:0;background:#fff;border-right:1px solid var(--line);z-index:700}
.filters{padding:16px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.crumb{font-weight:800;font-size:15px}.sub{font-size:12px;color:var(--mut);line-height:1.45}
select,input{width:100%;border:1px solid #cbd4cc;background:#fff;color:var(--ink);border-radius:7px;padding:10px 9px;min-height:39px;outline-color:#528577}
.listtop{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700}
#items{overflow:auto;min-height:0;flex:1}.item{border:0;border-bottom:1px solid #eff2ee;background:#fff;width:100%;text-align:left;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.item:hover,.item:focus{background:#eff6f1}.item b{font-size:13px}.tiny{font-size:11px;color:var(--mut)}.red{color:var(--red);font-size:17px;line-height:1}.muted{color:#a2aaa5}
#map{width:100%;height:100%;background:#ebece8;z-index:1}.mapwrap{min-width:0;position:relative}
#status{position:absolute;left:14px;bottom:16px;z-index:600;background:#fffef9ed;border:1px solid #dbe2dc;border-radius:7px;padding:9px 12px;font-size:12px;max-width:calc(100% - 28px);box-shadow:0 3px 12px #0001}
#detail{display:none;position:absolute;right:13px;top:13px;z-index:620;width:min(345px,calc(100% - 26px));background:#fff;border-radius:9px;box-shadow:0 6px 22px #0003;max-height:70vh;overflow:auto}
#detail.open{display:block}.dhead{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid var(--line)}
#detailBody{padding:13px 15px;font-size:13px;line-height:1.6}.source{border-top:1px solid #e6ece7;padding:9px 0}.source b{color:#114533}.close{background:#f2f5f1;border:0;border-radius:5px;font-size:20px;line-height:1;padding:4px 9px}
.leaflet-control-attribution{font-size:9px!important}.leaflet-tooltip.label{box-shadow:none;border:1px solid #d3dcd2;border-radius:4px;background:#fffffff0;padding:2px 5px;font-weight:700;color:#2b4237;font-size:11px;pointer-events:auto}
.leaflet-tooltip.label:before{display:none}.leaflet-tooltip.label.archive{border-color:#d04949;color:#9e1717;background:#fffcfcf5}
.leaflet-tooltip.province-label{background:transparent;border:0;box-shadow:none;font-weight:900;font-size:11px;color:#214b39;text-shadow:0 1px white,1px 0 white,-1px 0 white;pointer-events:none}
.leaflet-tooltip.province-label:before{display:none}
.marker-red{background:#d6212d;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #a3141d,0 1px 4px #0005}
.marker-grey{background:#adb4ae;border:1px solid white;border-radius:50%}
#menu{display:none}
@media(max-width:760px){main{grid-template-columns:1fr}aside{position:absolute;top:54px;left:0;width:min(310px,90vw);bottom:0;transform:translateX(-100%);transition:transform .16s;box-shadow:5px 0 18px #0002}aside.open{transform:none}#menu{display:inline-block;background:var(--green);color:white;border:0;border-radius:5px;padding:6px 10px}header{gap:9px;padding:0 10px}header strong{font-size:13px}header span{display:none}}
</style></head>
<body>
<header><button id="menu" type="button">☰</button><a href="./index.html">← ARŞİVE DÖN</a><strong>ALİDEDEOĞLU · YERADLARI HARİTASI</strong><span>GÜNCEL KÖYLER · TARİHÎ NFS / TMT</span></header>
<main><aside id="side">
<div class="filters"><div class="crumb" id="crumb">TÜRKİYE</div><div class="sub">İl → ilçe → köy → köy altı mahalle seçin. Haritayı serbestçe gezdirin; kırmızı noktalar arşiv kaydı bulunan yerleri gösterir.</div>
<select id="province"><option value="">İL SEÇİN</option></select>
<select id="district" disabled><option value="">ÖNCE İL SEÇİN</option></select>
<select id="village" disabled><option value="">ÖNCE İLÇE SEÇİN</option></select>
<select id="hamlet" disabled><option value="">KÖY ALTI MAHALLE</option></select>
<input id="search" placeholder="Köy / mahalle ara" aria-label="Yerleşim ara">
<button id="back" type="button" style="border:1px solid #cbd4cc;background:#f6faf6;border-radius:6px;padding:8px">ÜST SEVİYEYE DÖN</button>
</div><div class="listtop"><span id="listTitle">İLLER</span><span class="tiny" id="listCount"></span></div><div id="items"></div>
</aside><div class="mapwrap"><div id="map"></div><div id="status">Harita hazırlanıyor…</div>
<div id="detail"><div class="dhead"><strong id="detailTitle">KÖY</strong><button id="close" type="button" class="close" aria-label="Kapat">×</button></div><div id="detailBody"></div></div>
</div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id), norm=v=>String(v||'').toLocaleLowerCase('tr-TR').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ı/g,'i').replace(/ğ/g,'g').replace(/ş/g,'s').replace(/ö/g,'o').replace(/ü/g,'u').replace(/ç/g,'c');
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtKm=n=>Math.round(n/1000);
const map=L.map('map',{center:[39.05,35.2],zoom:6,minZoom:5,maxZoom:17,preferCanvas:true,zoomAnimation:false,markerZoomAnimation:false,fadeAnimation:false});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
let provinces=[],districts=[],pointsManifest=null,level='country',chosenProvince=null,chosenDistrict=null;
const pointCanvas=L.canvas({padding:.12});
let provinceLayer=null,districtLayer=null,districtGeoPromise=null,placeLayer=L.layerGroup().addTo(map),labels=L.layerGroup().addTo(map),radiusLayer=L.layerGroup().addTo(map),regionRing=null;
let currentPoints=[],loadedPoints=new Map(),records=new Map(),loadedArchive=false,archivePromise=null,selectionToken=0,regionTimer=0,viewportToken=0,provinceGeometryByName=new Map(),lastRenderSignature='',archiveVersion=0;
const status=m=>{$('status').textContent=m};
const mobileClose=()=>{$('side').classList.remove('open')};
function clearPlaces(){lastRenderSignature='';++radiusRequest;++viewportToken;currentPoints=[];placeLayer.clearLayers();labels.clearLayers();radiusLayer.clearLayers();resetVillageSelectors();if(regionRing){map.removeLayer(regionRing);regionRing=null}}
function clearDistrictLayer(){if(districtLayer){map.removeLayer(districtLayer);districtLayer=null}}
async function getDistrictGeometry(){if(!districtGeoPromise)districtGeoPromise=json('./geo/districts.geojson').catch(e=>{districtGeoPromise=null;throw e});return districtGeoPromise}
function plate(id){return String(id||'').split('-').slice(-2,-1)[0]||''}
const PLATE_BY_NAME=new Map(["Adana","Adıyaman","Afyonkarahisar","Ağrı","Amasya","Ankara","Antalya","Artvin","Aydın","Balıkesir","Bilecik","Bingöl","Bitlis","Bolu","Burdur","Bursa","Çanakkale","Çankırı","Çorum","Denizli","Diyarbakır","Edirne","Elazığ","Erzincan","Erzurum","Eskişehir","Gaziantep","Giresun","Gümüşhane","Hakkari","Hatay","Isparta","Mersin","İstanbul","İzmir","Kars","Kastamonu","Kayseri","Kırklareli","Kırşehir","Kocaeli","Konya","Kütahya","Malatya","Manisa","Kahramanmaraş","Mardin","Muğla","Muş","Nevşehir","Niğde","Ordu","Rize","Sakarya","Samsun","Siirt","Sinop","Sivas","Tekirdağ","Tokat","Trabzon","Tunceli","Şanlıurfa","Uşak","Van","Yozgat","Zonguldak","Aksaray","Bayburt","Karaman","Kırıkkale","Batman","Şırnak","Bartın","Ardahan","Iğdır","Yalova","Karabük","Kilis","Osmaniye","Düzce"].map((name,i)=>[norm(name),'TR-P-'+String(i+1).padStart(2,'0')]));
function provinceID(p){return PLATE_BY_NAME.get(norm(p?.properties?.name))||''}
function neighborsForProvince(p){const id=provinceID(p);return districts.filter(d=>d.parent_id===id).sort((a,b)=>a.name.localeCompare(b.name,'tr'))}
function itemList(arr,title,label,click,has){
 $('listTitle').textContent=title;$('listCount').textContent=arr.length+' KAYIT';
 let q=norm($('search').value),list=q?arr.filter(x=>norm(label(x)).includes(q)):arr;
 const root=$('items');root.textContent='';
 for(const x of list.slice(0,550)){
  const btn=document.createElement('button');btn.className='item';btn.type='button';
  const tx=document.createElement('span');tx.innerHTML='<b>'+esc(label(x))+'</b>';
  const dot=document.createElement('span');dot.className=has&&has(x)?'red':'muted';dot.textContent=has&&has(x)?'●':'›';
  btn.append(tx,dot);btn.onclick=()=>{click(x);mobileClose()};root.append(btn)
 }
}
async function json(path){let r=await fetch(path,{cache:'force-cache'});if(!r.ok)throw Error(path+' · HTTP '+r.status);return r.json()}
function drawProvinceLayer(){
 if(provinceLayer){map.removeLayer(provinceLayer);provinceLayer=null}
 provinceLayer=L.geoJSON({type:'FeatureCollection',features:provinces},{
  style:{color:'#75917e',weight:1.1,fillColor:'#eaf1e8',fillOpacity:.07},
  onEachFeature:(f,l)=>{const n=f.properties.name;l.on('click',()=>openProvince(n));l.bindTooltip(n,{className:'province-label',direction:'center',permanent:false,sticky:true,opacity:1})}
 }).addTo(map);
}
function resetVillageSelectors(){$('village').disabled=true;$('village').innerHTML='<option value="">ÖNCE İLÇE SEÇİN</option>';$('hamlet').disabled=true;$('hamlet').innerHTML='<option value="">KÖY ALTI MAHALLE</option>'}
function resetCountry(){
 ++selectionToken;level='country';chosenProvince=null;chosenDistrict=null;clearPlaces();clearDistrictLayer();
 $('province').value='';$('district').disabled=true;$('district').innerHTML='<option>ÖNCE İL SEÇİN</option>';
 $('crumb').textContent='TÜRKİYE';$('detail').classList.remove('open');drawProvinceLayer();
 if(provinceLayer)map.fitBounds(provinceLayer.getBounds(),{padding:[8,8],animate:false});
 itemList(provinces,'İLLER',x=>x.properties.name,x=>openProvince(x.properties.name));
 status('BİR İLE TIKLAYIN · İLÇELERİ GÖRÜN');
}
async function openProvince(name){
 const p=provinces.find(x=>norm(x.properties.name)===norm(name));if(!p)return;
 const token=++selectionToken;level='province';chosenProvince=p;chosenDistrict=null;clearPlaces();clearDistrictLayer();
 $('province').value=p.properties.name;$('district').disabled=false;
 const arr=neighborsForProvince(p);
 $('district').innerHTML='<option value="">İLÇE SEÇİN</option>'+arr.map(d=>'<option value="'+esc(d.id)+'">'+esc(d.name)+'</option>').join('');
 $('crumb').textContent=p.properties.name.toLocaleUpperCase('tr-TR');
 itemList(arr,'İLÇELER',x=>x.name,x=>openDistrict(x));
 $('detail').classList.remove('open');
 if(provinceLayer)map.removeLayer(provinceLayer);provinceLayer=null;
 const poly=L.geoJSON(p,{style:{color:'#3c6d50',weight:2,fillColor:'#edf4e8',fillOpacity:.08},interactive:false}).addTo(map);provinceLayer=poly;
 map.fitBounds(poly.getBounds(),{padding:[20,20],maxZoom:9,animate:false});
 status(p.properties.name+' · İLÇE SEÇİN');
 // Boundaries load after the sidebar is ready; only selected province districts are drawn.
 void getDistrictGeometry().then(data=>{
  if(token!==selectionToken||level!=='province')return;
  const wanted=new Map(arr.map(d=>[d.id,d]));
  const fs=(data.features||[]).filter(f=>wanted.has(f.properties?.id) && wanted.get(f.properties.id).parent_id===provinceID(p));
  districtLayer=L.geoJSON({type:'FeatureCollection',features:fs},{style:{color:'#648875',weight:1.2,fillColor:'#c8d8c7',fillOpacity:.12},onEachFeature:(f,l)=>{
   const local=wanted.get(f.properties?.id);
   if(!local)return;
   l.bindTooltip(local.name,{permanent:false,sticky:true,direction:'center',className:'label',opacity:1});
   l.on('click',e=>{L.DomEvent.stopPropagation(e.originalEvent);openDistrict(local)})
  }}).addTo(map)
 }).catch(e=>console.warn('İlçe geometrisi açılamadı:',e));
 mobileClose();
}
function districtInfo(d){return chosenProvince?chosenProvince.properties.name+' / '+d.name:d.name}
async function openDistrict(d){
 const local=typeof d==='string'?districts.find(x=>x.id===d):d;if(!local||!chosenProvince||local.parent_id!==provinceID(chosenProvince))return;
 const token=++selectionToken;chosenDistrict=local;level='district';clearPlaces();clearDistrictLayer();
 $('district').value=local.id;$('crumb').textContent=chosenProvince.properties.name.toLocaleUpperCase('tr-TR')+' / '+local.name.toLocaleUpperCase('tr-TR');
 $('detail').classList.remove('open');itemList([],'KÖYLER',x=>x.name,()=>{});
 status('KÖYLER YÜKLENİYOR · '+districtInfo(local));
 try{
  const pts=await loadDistrictPoints(local);if(token!==selectionToken)return;
  currentPoints=pts;populateVillageSelectors();let feats=pts.map(p=>p.feature);
  if(feats.length){const b=L.latLngBounds(feats.map(f=>[f.geometry.coordinates[1],f.geometry.coordinates[0]]));if(b.isValid())map.fitBounds(b,{padding:[40,40],maxZoom:11,animate:false})}
  renderPlaces();renderDistrictItems();
  status(local.name+' · '+pts.length+' YERLEŞİM · KIRMIZI: ARŞİV KAYDI');
  void ensureArchive().then(()=>{if(token===selectionToken){renderPlaces();renderDistrictItems()}});
 }catch(e){if(token===selectionToken)status('KÖY KONUM DOSYASI AÇILAMADI · '+String(e.message||e))}
 mobileClose()
}
function pointKey(il,ilce,koy){
 const province=norm(il),district=norm(ilce);
 let place=norm(koy);
 if(province==='kastamonu'){
  place=place.replace(/\s+mahallesi$/,'');
  if(district==='abana'&&place==='abana merkez')place='abana ilce merkezi';
  if(district==='taskopru'||district==='hanonu')place=place.replace(/[\s-]+/g,'');
 }
 return province+'|'+district+'|'+place
}
function populateVillageSelectors(){
 const known=new Map();for(const p of currentPoints){const parent=p.parentVillage;if(parent){if(!known.has(norm(parent)))known.set(norm(parent),{name:parent,place:null});}else if(!known.has(norm(p.name)))known.set(norm(p.name),{name:p.name,place:p})}
 const list=[...known.values()].sort((a,b)=>a.name.localeCompare(b.name,'tr'));
 $('village').innerHTML='<option value="">KÖY / MAHALLE SEÇİN</option>'+list.map(x=>'<option value="'+esc(x.name)+'">'+esc(x.name)+'</option>').join('');$('village').disabled=false;
 $('hamlet').disabled=true;$('hamlet').innerHTML='<option value="">KÖY ALTI MAHALLE SEÇİN</option>';
}
function selectVillage(name){const k=norm(name);$('hamlet').innerHTML='<option value="">KÖY ALTI MAHALLE SEÇİN</option>';const children=currentPoints.filter(p=>norm(p.parentVillage)===k);$('hamlet').innerHTML+=children.map(p=>'<option value="'+esc(p.name)+'">'+esc(p.name)+'</option>').join('');$('hamlet').disabled=!children.length;
 const own=currentPoints.find(p=>norm(p.name)===k&&!p.parentVillage);if(own){map.setView([own.lat,own.lng],Math.max(11,map.getZoom()),{animate:false});selectPlace(own)}else if(children.length){map.setView([children[0].lat,children[0].lng],11,{animate:false})}renderDistrictItems();}
function renderDistrictItems(){
 const currentKeys=new Set(currentPoints.map(p=>pointKey(p.il,p.ilce,p.name)));
 const prefix=norm(chosenProvince.properties.name)+'|'+norm(chosenDistrict.name)+'|';
 const withoutPoint=[];
 for(const [key,list] of records){
  if(!key.startsWith(prefix)||currentKeys.has(key))continue;
  const row=list.find(r=>r.yerlesim_anahtari_sabit||r.sulale_kayitlari?.length);
  if(row)withoutPoint.push({name:row.koy,il:row.il,ilce:row.ilce})
 }
 const key=norm($('village').value);const pts=key?currentPoints.filter(p=>norm(p.name)===key||norm(p.parentVillage)===key):currentPoints;
 itemList(pts.concat(key?[]:withoutPoint),key?'KÖY / KÖY ALTI':'KÖY / MAHALLE',x=>x.name+(x.feature?'':' · ARŞİV KARTI'),selectPlace,hasRecord)
}
function appendKnownArchivePoints(points, district, province){
 const list=points.slice();
 const keys=new Set(points.map(p=>pointKey(p.il,p.ilce,p.name)));
 const prefix=norm(province)+'|'+norm(district.name)+'|';
 for(const [key, rows] of records){
  if(!key.startsWith(prefix)||keys.has(key))continue;
  const rec=rows.find(r=>Array.isArray(r.konum)&&r.konum.length===2&&r.konum.every(Number.isFinite));
  if(!rec)continue;
  const [lng,lat]=rec.konum;
  const feature={type:'Feature',geometry:{type:'Point',coordinates:[lng,lat]},properties:{name:rec.koy}};
  list.push({name:rec.koy,il:province,ilce:district.name,lng,lat,feature});
 }
 return list;
}
function hasRecord(p){return records.has(pointKey(p.il,p.ilce,p.name))}
async function loadDistrictPoints(d){
 if(loadedPoints.has(d.id)){
  if(loadedArchive){
   const province=provinces.find(p=>provinceID(p)===d.parent_id);
   loadedPoints.set(d.id,appendKnownArchivePoints(loadedPoints.get(d.id),d,province?.properties.name))
  }
  return loadedPoints.get(d.id)
 }
 const gj=await json('./geo/points/'+encodeURIComponent(d.id)+'.geojson');
 const province=provinces.find(p=>provinceID(p)===d.parent_id);
 const points=(gj.features||[]).filter(f=>f.geometry?.type==='Point'&&Array.isArray(f.geometry.coordinates)).map(f=>({name:f.properties.name,il:province?.properties.name||'',ilce:d.name,lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0],kind:f.properties.kind||'',parentVillage:f.properties.parent_village||f.properties.village||f.properties.koy_adi||f.properties.parent_name||'',feature:f}));
 const arr=loadedArchive?appendKnownArchivePoints(points,d,province?.properties.name):points;
 loadedPoints.set(d.id,arr);
 return arr
}
function renderPlaces(force=false){
 if(level!=='district')return;
 const bounds=map.getBounds().pad(.10),zoom=map.getZoom(),seen=new Set(),visible=[];
 const signature=[zoom,bounds.getSouth().toFixed(2),bounds.getWest().toFixed(2),bounds.getNorth().toFixed(2),bounds.getEast().toFixed(2),archiveVersion,loadedPoints.size].join('|');
 if(!force&&signature===lastRenderSignature)return;
 lastRenderSignature=signature;placeLayer.clearLayers();labels.clearLayers();
 const capacity=zoom<9?220:zoom<12?450:650;
 outer:for(const rows of loadedPoints.values())for(const p of rows){if(visible.length>=capacity)break outer;if(!bounds.contains([p.lat,p.lng]))continue;const k=pointKey(p.il,p.ilce,p.name);if(!seen.has(k)){seen.add(k);visible.push(p)}}
 // Circles use Canvas, never thousands of HTML elements.
 for(const p of visible){
  const marked=hasRecord(p);
  const d=L.circleMarker([p.lat,p.lng],{radius:marked?5.5:3.7,color:marked?'#a4131e':'#8c978f',weight:1.4,fillColor:marked?'#e2222b':'#c0c8c0',fillOpacity:1,bubblingMouseEvents:false,renderer:pointCanvas}).addTo(placeLayer);
  d.on('click',e=>{L.DomEvent.stopPropagation(e.originalEvent);selectPlace(p)})
 }
 if(zoom>=11){
  const max=zoom>=12?55:30;for(const p of visible.slice(0,max)){
   L.marker([p.lat,p.lng],{interactive:false,keyboard:false,icon:L.divIcon({className:'',html:'<span style="background:#fffffff2;border:1px solid '+(hasRecord(p)?'#d65353':'#d3dcd2')+';border-radius:3px;font-size:11px;font-weight:650;padding:2px 4px;white-space:nowrap;color:#243b2b;position:relative;top:-18px;left:7px">'+esc(p.name)+'</span>',iconSize:[0,0]})}).on('click',()=>selectPlace(p)).addTo(labels)
  }
 }
}
function selectPlace(p){
 const k=pointKey(p.il,p.ilce,p.name);
 $('detailTitle').textContent=p.name;$('detailBody').innerHTML='<div class="tiny">'+esc(p.il)+' / '+esc(p.ilce)+'</div><p>ARŞİV KAYDI KONTROL EDİLİYOR…</p>';$('detail').classList.add('open');
 showDetails(p);
 // Only click loads the 50km neighborhood. Panning never fetches new files.
 if(p.feature)void showRadius(p);
 mobileClose()
}
function showDetails(p){
 const list=records.get(pointKey(p.il,p.ilce,p.name))||[],b=$('detailBody');
 let html='<div class="tiny">'+esc(p.il)+' / '+esc(p.ilce)+'</div>';
 if(!loadedArchive){html+='<p>Arşiv kataloğu yükleniyor…</p>';b.innerHTML=html;return}
 if(!list.length){html+='<p>BU KÖYE DOĞRULANMIŞ NFS/TMT FİHRİSTİ HENÜZ BAĞLANMADI.</p>'}
 else{
  const seen=new Set();for(const rec of list){
   for(const d of rec.defterler||[]){
    const sig=[d.defter,d.yil,d.sayfa,d.varak,d.kayit_adi,d.divan].join('|');if(!d.defter||seen.has(sig))continue;seen.add(sig);
    html+='<div class="source"><b>'+esc(d.defter)+'</b>'+
      '<div>'+esc([d.tur,d.yil].filter(Boolean).join(' · '))+'</div>'+
      (d.tarihi_kaza||rec.tarihi_kaza?'<div>TAHRİR / KAZA: '+esc(d.tarihi_kaza||rec.tarihi_kaza)+'</div>':'')+
      (d.kayit_adi||rec.tarihi_karye?'<div>TARİHÎ AD: '+esc(d.kayit_adi||rec.tarihi_karye)+'</div>':'')+
      (d.sayfa!=null?'<div>SAYFA: '+esc(d.sayfa)+'</div>':'')+
      (d.varak!=null?'<div>VARAK: '+esc(d.varak)+'</div>':'')+
      (d.hane!=null?'<div>HANE: '+esc(d.hane)+'</div>':'')+
      (d.erkek!=null?'<div>ERKEK: '+esc(d.erkek)+'</div>':'')+
      (d.divan?'<div>DİVAN: '+esc(d.divan)+'</div>':'')+
      (d.eslesme_durumu?'<div>'+esc(d.eslesme_durumu)+'</div>':'')+
      (d.aciklama?'<div>'+esc(d.aciklama)+'</div>':'')+
      '</div>'
   }
  }
  if(!seen.size)html+='<p>YERLEŞİM KAYDI VAR; DEFTER KÜNYESİ HENÜZ GİRİLMEDİ.</p>';
  const citations=list.flatMap(r=>r.sulale_kayitlari||[]);
  if(citations.length){
   html+='<div class="source"><b>TERCÜME EDİLMİŞ SÜLALELER</b>'+citations.map(f=>'<div style="margin-top:8px"><b>'+esc(f.ad)+'</b><div>'+esc([f.tarihi_kaza+' KAZASI',f.defter,f.karye,f.sayfa&&'SAYFA '+f.sayfa,f.hane&&'HANE '+f.hane,f.aday&&'YER EŞLEŞMESİ ADAY'].filter(Boolean).join(' · '))+'</div></div>').join('')+'</div>'
  }
  const citedNames=new Set(citations.map(f=>norm(f.ad)));
  const f=[...new Set(list.flatMap(r=>r.sulaleler||[]).filter(x=>typeof x==='string'&&x&&!citedNames.has(norm(x))))].slice(0,40);
  if(f.length)html+='<div class="source"><b>SÜLALELER</b><div>'+f.map(esc).join(' · ')+'</div></div>'
 }
 b.innerHTML=html
}
function insertArchive(rec){
 if(!rec||!rec.il||!rec.ilce||!rec.koy)return;
 const k=pointKey(rec.il,rec.ilce,rec.koy);
 if(!records.has(k))records.set(k,[]);
 records.get(k).push(rec)
}
async function ingestNDJSON(path){
 try{
  const response=await fetch(path,{cache:'force-cache'});if(!response.ok)return;
  const raw=await response.text(),lines=raw.split(/\r?\n/);
  for(let i=0;i<lines.length;i+=250){
   for(const line of lines.slice(i,i+250)){if(!line||line.indexOf('"_summary"')>=0)continue;try{insertArchive(JSON.parse(line))}catch(e){}}
   await new Promise(done=>setTimeout(done,0))
  }
 }catch(e){console.warn('Arşiv okunamadı:',path,e)}
}
function ensureArchive(){
 if(archivePromise)return archivePromise;
 // Read real BOA data from existing sources. Additional catalogues can be added here without touching the map.
 const sources=['./catalog/arac_havzasi_1840_nfs_1844_1845_tmt_fihristi_20261121.ndjson?v=20261121-nfs938','./catalog/taskopru_havzasi_nfs_tmt_sulaleler_20261121.ndjson','./catalog/kastamonu_nfs_tercume_sulaleleri_20261121.ndjson?v=taskopru20261121','./archive_verified.ndjson','./archive_1.ndjson','./archive_2.ndjson','./archive_3.ndjson','./archive_4.ndjson','./archive_5.ndjson','./catalog/archive_library_verified_20261111.ndjson','./catalog/amasya_1830_1850_kazalar_guncel_yerlesim_eslesmeleri_20261121.ndjson','./catalog/gelingiras_1846_nfs2176_1845_tmt_fihrist_20261119.ndjson','./catalog/tasabad_1844_1845_tmt_guncel_koy_eslesmeleri_20261121.ndjson'];
 archivePromise=(async()=>{for(const file of sources)await ingestNDJSON(file);loadedArchive=true;++archiveVersion;
  if(level==='district'&&chosenDistrict){
   currentPoints=appendKnownArchivePoints(currentPoints,chosenDistrict,chosenProvince.properties.name);
   loadedPoints.set(chosenDistrict.id,currentPoints);populateVillageSelectors();
   renderPlaces();renderDistrictItems()
  }
  const title=$('detailTitle').textContent;
  if(chosenDistrict){const p=currentPoints.find(x=>x.name===title);if(p)showDetails(p)}
 })();
 return archivePromise
}
let radiusRequest=0;
async function showRadius(center){
 const token=++radiusRequest,origin=L.latLng(center.lat,center.lng),radius=25000;
 if(regionRing){map.removeLayer(regionRing);regionRing=null}
 radiusLayer.clearLayers();
 regionRing=L.circle(origin,{radius,color:'#b32929',weight:1,fill:false,interactive:false}).addTo(map);
 const nearby=Array.from(loadedPoints.values()).flat().filter(p=>map.distance(origin,[p.lat,p.lng])<=radius);
 // Exact 25km radius (50km diameter), including nearby districts across province borders.
 try{
  const geometry=await getDistrictGeometry();
  if(token!==radiusRequest)return;
  const pad=radius/111000,lonPad=pad/Math.max(.3,Math.cos(origin.lat*Math.PI/180));
  const area=L.latLngBounds([origin.lat-pad,origin.lng-lonPad],[origin.lat+pad,origin.lng+lonPad]);
  const ids=new Set();
  const neighbors=(geometry.features||[]).filter(f=>intersectsView(f,area)).map(f=>{
   const id=f.properties&&f.properties.id;if(!id||ids.has(id))return null;ids.add(id);
   return districts.find(d=>d.id===id)
  }).filter(d=>d&&d.id!==chosenDistrict?.id).slice(0,18);
  let cursor=0;async function work(){
   while(cursor<neighbors.length&&token===radiusRequest){
    const d=neighbors[cursor++];
    try{const ps=await loadDistrictPoints(d);if(token!==radiusRequest)return;
     for(const p of ps)if(map.distance(origin,[p.lat,p.lng])<=radius)nearby.push(p)
    }catch(e){}
    await new Promise(done=>setTimeout(done,0))
   }
  }
  await Promise.all(Array.from({length:Math.min(2,neighbors.length)},()=>work()))
 }catch(e){console.warn('Yakın çevre sınır verisi yüklenemedi',e)}
 if(token!==radiusRequest)return;
 // Do not add 100s of duplicate HTML markers. Show nearby items only if coordinates are visible.
 const near=nearby.filter(p=>map.getBounds().pad(.1).contains([p.lat,p.lng]));
 const present=new Set(currentPoints.map(p=>pointKey(p.il,p.ilce,p.name)));
 for(const p of near.slice(0,150)){
  if(present.has(pointKey(p.il,p.ilce,p.name)))continue;
  L.circleMarker([p.lat,p.lng],{radius:hasRecord(p)?5:3,color:hasRecord(p)?'#bc0f20':'#9da49a',fillColor:hasRecord(p)?'#ea212a':'#b9c0b6',fillOpacity:1,weight:1}).on('click',()=>selectPlace(p)).addTo(radiusLayer);
  L.marker([p.lat,p.lng],{interactive:true,keyboard:false,icon:L.divIcon({className:'',html:'<span style="position:relative;left:7px;top:-18px;background:#fffffff0;border:1px solid #d0d8d1;border-radius:3px;padding:2px 4px;white-space:nowrap;font-size:11px;font-weight:650">'+esc(p.name)+'</span>',iconSize:[0,0]})}).on('click',()=>selectPlace(p)).addTo(radiusLayer)
 }
 status('SEÇİLEN YER · 50 KM ÇAP · '+nearby.length+' YERLEŞİM');
}
const districtBoundsCache=new WeakMap();
function intersectsView(f,bounds){
 let b=districtBoundsCache.get(f);
 if(!b){let south=90,north=-90,west=180,east=-180;
  function walk(a){if(typeof a[0]==='number'){west=Math.min(west,a[0]);east=Math.max(east,a[0]);south=Math.min(south,a[1]);north=Math.max(north,a[1])}
    else for(const v of a)walk(v)}
  walk(f.geometry.coordinates);b={south,north,west,east};districtBoundsCache.set(f,b)
 }
 return b.south<=bounds.getNorth()&&b.north>=bounds.getSouth()&&b.west<=bounds.getEast()&&b.east>=bounds.getWest()
}
async function loadViewportPoints(){
 if(level!=='district'||map.getZoom()<9)return;
 const token=++viewportToken,bounds=map.getBounds().pad(.12);
 try{
  const data=await getDistrictGeometry();if(token!==viewportToken||level!=='district')return;
  const localById=new Map(districts.map(d=>[d.id,d]));
  const tasks=(data.features||[]).filter(f=>intersectsView(f,bounds)).map(f=>localById.get(f.properties?.id)).filter(Boolean).filter(d=>!loadedPoints.has(d.id)).slice(0,3);
  let i=0;async function worker(){while(i<tasks.length&&token===viewportToken){
   const d=tasks[i++];try{await loadDistrictPoints(d)}catch(e){}
   await new Promise(done=>setTimeout(done,0))
  }}
  await Promise.all(Array.from({length:Math.min(2,tasks.length)},()=>worker()));
  if(token===viewportToken)renderPlaces(true)
 }catch(e){console.warn('Görünür bölge noktaları yüklenemedi',e)}
}
map.on('moveend zoomend',()=>{clearTimeout(regionTimer);regionTimer=setTimeout(()=>{renderPlaces();void loadViewportPoints()},280)});
map.on('click',()=>{if(level==='district'){$('detail').classList.remove('open')}});
$('close').onclick=()=>{$('detail').classList.remove('open')};

$('search').oninput=()=>{if(level==='country')itemList(provinces,'İLLER',x=>x.properties.name,x=>openProvince(x.properties.name));
 else if(level==='province')itemList(neighborsForProvince(chosenProvince),'İLÇELER',x=>x.name,x=>openDistrict(x));
 else if(chosenDistrict)renderDistrictItems()};
$('province').onchange=e=>e.target.value?openProvince(e.target.value):resetCountry();
$('district').onchange=e=>{if(e.target.value)openDistrict(e.target.value);else if(chosenProvince)openProvince(chosenProvince.properties.name)};
$('village').onchange=e=>{if(e.target.value)selectVillage(e.target.value);else{ $('hamlet').disabled=true;$('hamlet').innerHTML='<option value="">KÖY ALTI MAHALLE SEÇİN</option>';renderDistrictItems()}};
$('hamlet').onchange=e=>{const p=currentPoints.find(p=>p.name===e.target.value&&norm(p.parentVillage)===norm($('village').value));if(p){map.setView([p.lat,p.lng],13,{animate:false});selectPlace(p)}};
$('back').onclick=()=>{if(level==='district'&&chosenProvince)openProvince(chosenProvince.properties.name);else resetCountry()};
