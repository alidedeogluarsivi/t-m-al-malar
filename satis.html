function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function imgFor(x){
  return x.cover_url||x.osmanlica_preview_url||x.preview_url||x.page_preview_url||null;
}
function previewKind(x){
  if(x.cover_url)return 'KAPAK';
  if(x.osmanlica_preview_url)return 'ORİJİNAL OSMANLICA';
  if(x.preview_url||x.page_preview_url)return 'PDF SAYFASI';
  return 'OTOMATİK KAPAK';
}
function autoCover(x){
  const p=(x.products||[])[0]||{};
  return '<div class="autoCover"><div class="brand">ALİDEDEOĞLU ARŞİVİ</div><div class="place">'+esc(x.koy||'ARŞİV PDF')+'</div><div class="loc">'+esc([x.ilce,x.il].filter(Boolean).join(' / '))+'</div><div class="def">'+esc(p.defter||p.tur||'OSMANLI ARŞİV BELGESİ')+'</div><div class="year">'+esc(p.yil||'')+'</div><div class="tag">E-SATIŞ ÖNİZLEME</div></div>';
}
function render(rows){
  count.textContent=rows.length.toLocaleString('tr-TR')+' PDF';
  grid.innerHTML=rows.map((x,i)=>{
    const im=imgFor(x);
    return '<article class="card" data-i="'+i+'"><div class="thumb">'+(im?'<img src="'+esc(im)+'" alt="">':autoCover(x))+'</div><div class="body"><h2>'+esc(x.koy)+'</h2><small>'+esc([x.ilce,x.il].filter(Boolean).join(' / '))+'</small><div><span class="pill">'+esc(previewKind(x))+'</span><span class="pill">'+(x.products||[]).length+' ÜRÜN</span></div></div></article>'
  }).join('');
  [...grid.querySelectorAll('[data-i]')].forEach(el=>el.onclick=()=>open(rows[Number(el.dataset.i)]));
}
function open(x){
  mt.textContent=x.koy||'PDF';
  ml.innerHTML='<small>'+esc([x.ilce,x.il].filter(Boolean).join(' / '))+'</small>';
  const im=imgFor(x);
  pv.innerHTML=im?'<img src="'+esc(im)+'" alt="'+esc(previewKind(x))+'">':autoCover(x);
  mi.innerHTML='<div class="notice"><b>ÖNİZLEME TÜRÜ:</b> '+esc(previewKind(x))+'<br>ÖDEME SHOPIER ÜZERİNDEN ALINIR. PDF, ÖDEME ONAYLANDIKTAN SONRA ALİDEDEOĞLU ARŞİVİ SİTESİNDEN TESLİM EDİLİR.</div>'+(x.products||[]).map(p=>'<div class="record"><b>'+esc([p.tur,p.yil].filter(Boolean).join(' · '))+'</b>'+(p.defter?'<br>DEFTER NO: '+esc(p.defter):'')+(p.hane?'<br>HANE: '+esc(p.hane):'')+(p.erkek?'<br>ERKEK: '+esc(p.erkek):'')+(Number(p.price_tl)>0?'<div class="price">'+Number(p.price_tl).toLocaleString('tr-TR')+' TL</div>':'<div><b>FİYAT HAZIRLANIYOR</b></div>')+(p.shopier_url?'<a class="buy" href="'+esc(p.shopier_url)+'" target="_blank" rel="noopener">SHOPIER\'DEN SATIN AL</a>':'<span class="buy off">SHOPIER ÖDEME LİNKİ HAZIRLANIYOR</span>')+'<div class="paynote">KARTLA ÖDEME SHOPIER SAYFASINDA TAMAMLANIR; PDF SHOPIER'DEN İNDİRİLMEZ.</div></div>').join('');
  modal.classList.add('open');
}
close.onclick=()=>modal.classList.remove('open');
modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};
q.oninput=()=>{
  const s=q.value.toLocaleLowerCase('tr-TR');
  const rows=DATA.items.filter(x=>JSON.stringify(x).toLocaleLowerCase('tr-TR').includes(s));
  render(rows);
};
render(DATA.items||[]);
</script>
