<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haritalar | Alidedeoğlu Arşivi</title>
<style>
:root{--ink:#142d3f;--paper:#f7f3eb;--line:#d8ccb9;--muted:#6d7880}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.shell{max-width:1400px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.top a{background:#17384e;color:#fff;text-decoration:none;padding:10px 14px;border-radius:10px;font-weight:900}.hero{background:linear-gradient(135deg,#112d44,#1b5268);color:#fff;border-radius:20px;padding:22px}.hero h1{margin:0 0 8px;font:700 32px Georgia,serif}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 8px 24px #0001;cursor:pointer}.cover{height:210px;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;background:linear-gradient(180deg,#f7efe2,#ead8bd);font:700 24px Georgia,serif}.body{padding:14px}.body h2{margin:0 0 6px;font:700 20px Georgia,serif}.body p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:50;padding:18px}.modal.open{display:flex;align-items:center;justify-content:center}.panel{width:min(900px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:16px;padding:18px;position:relative}.close{position:absolute;top:10px;right:10px;width:34px;height:34px;border:0;border-radius:50%;background:#17384e;color:#fff;font-size:20px}
</style></head><body><div class="shell"><div class="top"><a href="./">← ANA SAYFA</a><b>HARİTALAR</b></div><section class="hero"><h1>Osmanlı İdarî Haritaları</h1><p>Hazırlanan sancak, eyalet ve kaza haritaları.</p></section><div id="grid" class="grid"></div></div>
<div id="modal" class="modal"><div class="panel"><button id="close" class="close">×</button><h2 id="mt"></h2><div id="mc"></div></div></div>
<script>
const maps=[
{title:'ÇILDIR EYALETİ — 1835',cover:'ÇILDIR EYALETİ\n1835',text:'Çıldır Eyaleti sancakları ve NFS.d.2758–2776 serisi temel alınarak hazırlanmış çalışma.'},
{title:'KENGIRI / ÇANKIRI SANCAĞI',cover:'KENGIRI / ÇANKIRI\n1830–1845',text:'Kengırı ve bağlı kazaların nüfus defterleri üzerinden hazırlanmış sancak haritası.'},
{title:'ÇORUM VE ÇEVRESİ',cover:'ÇORUM\n1830–1845',text:'Çorum ve çevre kazaların tarihî idarî yapısını gösteren çalışma haritası.'},
{title:'KARAHİSAR-I ŞARKÎ',cover:'KARAHİSAR-I ŞARKÎ',text:'Tarihî kaza adları ile günümüz idarî alanlarını birlikte gösteren çalışma.'},
{title:'SİVAS',cover:'SİVAS\nNÜFUS DEFTERLERİ',text:'Sivas ve bağlı kazaların nüfus defterleri çalışma haritası.'},
{title:'KIRŞEHİR SANCAĞI',cover:'KIRŞEHİR SANCAĞI',text:'Kırşehir, Keskin, Konur, Mucur, Yüzdepare ve Hacıbektaş çevresini gösteren çalışma.'}
];
const grid=document.getElementById('grid'),modal=document.getElementById('modal'),mt=document.getElementById('mt'),mc=document.getElementById('mc');
grid.innerHTML=maps.map(function(x,i){return '<article class="card" data-i="'+i+'"><div class="cover">'+x.cover.replace(/\n/g,'<br>')+'</div><div class="body"><h2>'+x.title+'</h2><p>'+x.text+'</p></div></article>'}).join('');
Array.from(grid.querySelectorAll('[data-i]')).forEach(function(el){el.onclick=function(){const x=maps[Number(el.dataset.i)];mt.textContent=x.title;mc.innerHTML='<div class="cover" style="height:360px">'+x.cover.replace(/\n/g,'<br>')+'</div><p style="line-height:1.6">'+x.text+'</p>';modal.classList.add('open')}});
document.getElementById('close').onclick=function(){modal.classList.remove('open')};modal.onclick=function(e){if(e.target===modal)modal.classList.remove('open')};
</script></body></html>
