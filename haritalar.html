<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haritalar | Alidedeoğlu Arşivi</title>
<style>
:root{--ink:#142d3f;--paper:#f7f3eb;--line:#d8ccb9;--muted:#6d7880}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.shell{max-width:1500px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.top a{background:#17384e;color:#fff;text-decoration:none;padding:10px 14px;border-radius:10px;font-weight:900}.hero{background:linear-gradient(135deg,#112d44,#1b5268);color:#fff;border-radius:20px;padding:22px}.hero h1{margin:0 0 8px;font:700 32px Georgia,serif}.hero p{margin:0;color:#dce7ec}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-top:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 8px 24px #0001;cursor:pointer}.thumb{height:300px;background:#fff;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line)}.thumb img{width:100%;height:100%;object-fit:contain;display:block}.body{padding:14px}.body h2{margin:0 0 6px;font:700 20px Georgia,serif}.body p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.tag{display:inline-block;margin-top:10px;background:#efe7da;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:900;color:#765b31}.modal{display:none;position:fixed;inset:0;background:#000c;z-index:50;padding:16px}.modal.open{display:flex;align-items:center;justify-content:center}.panel{width:min(1400px,100%);height:min(94vh,1000px);background:#111;border-radius:14px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.panel img{max-width:100%;max-height:100%;object-fit:contain}.close{position:absolute;right:12px;top:12px;z-index:3;width:38px;height:38px;border:0;border-radius:50%;background:#fff;color:#17384e;font-size:24px;font-weight:900}.caption{position:absolute;left:12px;right:58px;bottom:12px;background:#000a;color:#fff;padding:9px 12px;border-radius:9px;font-size:12px}
@media(max-width:620px){.grid{grid-template-columns:1fr}.thumb{height:240px}.hero h1{font-size:27px}}
</style>
</head>
<body>
<div class="shell">
<div class="top"><a href="./">← ANA SAYFA</a><b>HARİTALAR</b></div>
<section class="hero"><h1>Osmanlı İdarî Haritaları</h1><p>Arşiv çalışmaları sırasında hazırlanmış gerçek sancak, kaza ve ilçe haritaları. Haritaya dokununca büyük açılır.</p></section>
<div id="grid" class="grid"></div>
</div>
<div id="modal" class="modal"><div class="panel"><button id="close" class="close">×</button><img id="full" alt=""><div id="caption" class="caption"></div></div></div>
<script>
const maps=[
{title:'ÇILDIR EYALETİ — 1835 TAM GÖRÜNÜM',src:'https://static.wixstatic.com/media/c3ec93_e98dd15b723c4f348f0875ce999669ec~mv2.jpg',type:'EYALET HARİTASI',text:'1835 Çıldır Eyaleti için hazırlanmış tam görünüm çalışma haritası.'},
{title:'ÇANKIRI — 1840–45 TARİHÎ KAZA HARİTASI',src:'https://static.wixstatic.com/media/c3ec93_2b16bf8c401d4a98876fc023180d2c23~mv2.jpg',type:'KAZA HARİTASI',text:'1840–45 dönemi Çankırı tarihî kaza dağılımını gösteren çalışma haritası.'},
{title:'ÇANKIRI’NIN TARİHÎ KAZA HARİTASI',src:'https://static.wixstatic.com/media/c3ec93_73c8f830be044bf8a7aa94abfe64ed9b~mv2.jpg',type:'KAZA HARİTASI',text:'Çankırı’nın tarihî kaza yapılanmasını gösteren ayrı çalışma haritası.'},
{title:'ATKARACALAR — 1845 TARİHÎ KAZA HARİTASI',src:'https://static.wixstatic.com/media/c3ec93_7c012354aee7411b99181500305c081a~mv2.jpg',type:'İLÇE / KAZA HARİTASI',text:'Atkaracalar çevresinin 1845 tarihî idarî dağılımını gösteren çalışma.'},
{title:'İSKİLİP — 1831 KAZA HARİTASI',src:'https://static.wixstatic.com/media/c3ec93_b8b167912a12426a9fc85418eee1b78f~mv2.jpg',type:'KAZA HARİTASI',text:'1831 İskilip kazası ve çevresi için hazırlanmış tarihî harita.'},
{title:'CANİK SANCAĞI — TARİHÎ İDARÎ HARİTA',src:'https://static.wixstatic.com/media/c3ec93_f33799628d574bafb2f21906ea47e57c~mv2.jpg',type:'SANCAK HARİTASI',text:'Canik Sancağı tarihî idarî yapısını gösteren çalışma haritası.'}
];
const grid=document.getElementById('grid'),modal=document.getElementById('modal'),full=document.getElementById('full'),caption=document.getElementById('caption');
grid.innerHTML=maps.map(function(x,i){return '<article class="card" data-i="'+i+'"><div class="thumb"><img loading="lazy" src="'+x.src+'" alt="'+x.title+'"></div><div class="body"><h2>'+x.title+'</h2><p>'+x.text+'</p><span class="tag">'+x.type+'</span></div></article>'}).join('');
Array.from(grid.querySelectorAll('[data-i]')).forEach(function(el){el.onclick=function(){const x=maps[Number(el.dataset.i)];full.src=x.src;full.alt=x.title;caption.textContent=x.title+' · '+x.type;modal.classList.add('open')}});
document.getElementById('close').onclick=function(){modal.classList.remove('open');full.src=''};modal.onclick=function(e){if(e.target===modal){modal.classList.remove('open');full.src=''}};
</script>
</body>
</html>
