name: Resmi koy baglilari veri guncelleme
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build-official-addresses.py
      - .github/workflows/sync-official-addresses.yml
  schedule:
    - cron: "0 6 1 * *"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and build public official settlement hierarchy
        run: python scripts/build-official-addresses.py
      - name: Commit generated village subordinate files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add official-addresses
          if ! git diff --cached --quiet; then
            git commit -m "Refresh district village subordinate hierarchy"
            git push
          fi
