name: Update public search name index
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build-search-index.py
      - catalog/**
      - archive_verified.ndjson
  schedule:
    - cron: '45 5 * * 1'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build public village and family name lookup
        run: python scripts/build-search-index.py
      - name: Commit refreshed index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recent-search-index.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public village and family lookup"
            for n in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              sleep 2
            done
          fi
